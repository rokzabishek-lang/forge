name: CI

# Windows on every push; everything else on request.
#
# The point of this file is that Windows gets tested when nobody is sitting at
# a Windows machine — most of what breaks there breaks in paths, process
# handling and line endings, and all three are invisible from a Mac until
# someone runs the app. That job earns its keep on every commit.
#
# The macOS jobs did not, and they were 69% of the bill. GitHub charges macOS
# runners at TEN times and rounds every job up to a whole minute, so a job that
# really took 1.4 minutes billed as 20 — while the Windows job, at 4.3 real
# minutes, billed 10. Measured on a real run:
#
#     windows-latest              4.3 min  x2  =  10
#     macos-latest                1.4 min  x10 =  20
#     installer (windows-latest)  3.6 min  x2  =   8
#     installer (macos-latest)    1.3 min  x10 =  20
#                                                 --
#                                                 58 billed minutes per push
#
# 2000 minutes a month is 34 pushes at that rate, and a working day can easily
# be five. So: Windows on every push (10), and the macOS suite and both
# installers when someone asks for them or tags a release.
#
# Nothing is lost by moving macOS off the hot path. The full suite is run
# locally on macOS before every push; that job was mostly confirming what the
# developer had already seen. Windows is the only one that ever says something
# new, because of the 2018 ffmpeg (docs/EFFECTS.md §25).
#
# If this ever stops mattering — the repo going public makes Actions free —
# put `macos-latest` back in the matrix and delete the `if` on `package`.
on:
  push:
    branches: [main]
    # A `v*` tag is the other way to ask for the full matrix and the
    # installers; see the `if` on `package`.
    tags: ['v*']
    # Documentation is a large part of this repo and none of the tests read it.
    # A prose-only commit does not need a runner.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:

# Pushing three times in twenty minutes used to run three full matrices to
# completion. Only the newest answer is worth anything, so the older ones are
# cancelled. The cost of this is that an intermediate commit on main can end up
# with no verdict of its own — acceptable when the alternative is paying for
# answers nobody reads.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Never cancel Windows because macOS failed. When a run goes red the
      # useful question is "on which platform", and that needs both answers.
      fail-fast: false
      matrix:
        # Both platforms only when asked for or when tagging; Windows alone on
        # an ordinary push.
        os: ${{ (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && fromJSON('["macos-latest","windows-latest"]') || fromJSON('["windows-latest"]') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The sidecar degrades every optional capability, so a bare interpreter
      # is enough for the handshake tests. Installing torch and friends on
      # every push would cost minutes for capabilities the suite already skips.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # `npm ci` rather than `npm install`: it honours the lockfile exactly, so
      # a run that passes here means the versions on disk are the ones tested.
      # It also fetches the per-platform ffmpeg binary, which is the whole
      # reason the integration tests can run on a runner at all.
      - run: npm ci

      - run: npm run typecheck

      # Integration tests included on purpose. They shell out to ffmpeg with
      # real paths, and a runner's Windows path — C:\a\forge\forge — is exactly
      # the shape that breaks filter arguments and concat lists.
      - run: npm test

      - run: npm run build

  package:
    name: installer (${{ matrix.os }})
    # Only once the suite is green. An installer built from a red commit is a
    # thing someone will install.
    needs: test
    # Not on every push. An installer is wanted when somebody intends to
    # install something — before a session on the Surface, or at a release —
    # and building one on every commit spent 28 billed minutes a time producing
    # artefacts that expired unused after fourteen days.
    #
    # Run the CI workflow by hand (Actions → CI → Run workflow) to get both, or
    # push a `v*` tag.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: pack:win
          - os: macos-latest
            script: pack:mac

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The reason this job exists at all, and why it cannot run on one runner
      # and cross-compile: `@ffmpeg-installer` ships the binary as an OPTIONAL
      # dependency per platform, so `npm ci` on a Mac installs only
      # darwin-arm64. Packing Windows from macOS yields an installer with no
      # ffmpeg in it — the app then starts and puts up assertBinaries()'s
      # dialog on the user's machine, which is the worst possible place to find
      # out. Each platform packs itself.
      - run: npm ci

      # `npm ci` can exit 0, report no vulnerabilities, and leave
      # node_modules/electron/dist EMPTY — measured on a fresh Windows clone,
      # where npm 11's allow-scripts gate withholds electron's postinstall and
      # its warning names electron-winstaller and esbuild but never electron.
      # It does not happen on macOS with the same npm, and it recurs on every
      # `npm ci` rather than being first-run setup.
      #
      # install.js short-circuits when the binary is already there, so this is
      # a no-op on a healthy tree and a repair on a broken one. The check after
      # it exists because the failure it prevents is silent: packing without
      # this produces either nothing or something that will not start, and
      # electron-builder does not say which.
      - name: Ensure Electron's binary is actually installed
        run: node node_modules/electron/install.js

      # Test the COMMAND, not the variable. `shell: bash` runs under `-e`, so
      # `BIN="$(node …)"` with a failing node aborts the step at the assignment
      # and the annotation below never prints — which is the whole point of it.
      # And `[ -e "$BIN" ]` would be unreachable anyway: electron's index.js
      # re-downloads when dist or path.txt is missing, so `require` either
      # throws or returns a path that exists.
      - name: Verify it before packing
        shell: bash
        run: |
          if ! BIN="$(node -p "require('electron')" 2>&1)"; then
            echo "::error::Electron's binary could not be resolved — npm ci withheld the postinstall. See CLAUDE.md, 'A fresh Windows checkout'."
            echo "$BIN"
            exit 1
          fi
          echo "Electron binary present: $BIN"

      # `assets/` is gitignored, so a CI checkout has none — and electron-builder
      # treats a missing extraResources source as nothing to copy rather than as
      # an error. The result is an installer that starts, works, and has an empty
      # Library tab, with nothing anywhere saying why. This makes the absence
      # loud: it does not fail the build, because an installer without the asset
      # pack is still worth having, but nobody should discover it by clicking.
      - name: Say whether the asset library is in this build
        shell: bash
        run: |
          if [ -d assets ] && [ -n "$(ls -A assets 2>/dev/null)" ]; then
            echo "Asset library present: $(du -sh assets | cut -f1)"
          else
            echo "::warning::No assets/ in this checkout — the installer will ship with an EMPTY asset library (no fonts, SFX, transitions, titles or props). It is gitignored; see docs/ASSETS.md 'Open decision'."
          fi

      - run: npm run ${{ matrix.script }}

      # What actually landed, so the next person does not have to unpack the
      # installer to find out. Every line here is a coupling that cannot fail
      # in development — see docs/PACKAGING.md.
      - name: Report what the package contains
        shell: bash
        run: |
          RES=$(find dist -maxdepth 3 -type d -name resources | head -1)
          echo "resources: $RES"
          for want in assets sidecar app.asar app.asar.unpacked; do
            if [ -e "$RES/$want" ]; then echo "  present: $want"; else echo "  MISSING: $want"; fi
          done

      # Uploaded rather than released. A release is a deliberate act; this is
      # just "something to install on the Surface this afternoon".
      - uses: actions/upload-artifact@v4
        with:
          name: forge-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
